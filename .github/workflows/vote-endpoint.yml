name: Vote endpoint tests

on:
  push:
    branches: [main, feature/vote-endpoint]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d threadbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/threadbase?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed development data
        run: npm run seed
      - name: Test vote endpoint HTTP statuses
        run: npm test
      - name: Type-check
        run: npm run typecheck
